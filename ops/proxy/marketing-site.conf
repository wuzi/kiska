server {
    listen 80;
    server_name usekiska.com www.usekiska.com app.usekiska.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/kiska-acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name usekiska.com www.usekiska.com;
    ssl_certificate /etc/letsencrypt/live/usekiska.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usekiska.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    if ($host = www.usekiska.com) { return 308 https://usekiska.com$request_uri; }
    root /var/www/kiska-landing;
    location = / {
        if ($arg_flow) { return 307 https://app.usekiska.com/app$is_args$args; }
        try_files /index.html =404;
    }
    location ^~ /landing-assets/ { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /favicon.ico { return 301 /landing-assets/favicon.png; }
    location / { return 308 https://app.usekiska.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name app.usekiska.com;
    ssl_certificate /etc/letsencrypt/live/app.usekiska.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.usekiska.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
