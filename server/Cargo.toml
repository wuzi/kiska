[package]
name = "kiska"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs","limit"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls","postgres","uuid","json","chrono","migrate"] }
uuid = { version = "1", features = ["v4","serde"] }
serde = {version="1", features=["derive"]}
serde_json = "1"
chrono = {version="0.4", features=["serde"]}
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
ammonia = "4"
pulldown-cmark = "0.13"
lettre = {version="0.11",default-features=false, features=["smtp-transport","builder","tokio1-rustls-tls"]}
rand = "0.8"
utoipa = {version="5",features=["uuid"]}
utoipa-axum = "0.2"
anyhow = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
dicebear-core = "11"
dicebear-styles = {version="11",features=["lorelei"]}

image = {version="0.25.10",default-features=false,features=["jpeg","png","webp"]}
rust-s3 = {version="0.35.1",default-features=false,features=["tokio-rustls-tls"]}

[dev-dependencies]
tower = {version="0.5",features=["util"]}
